name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Los tests levantan el contexto completo (Postgres + discovery de Cognito),
      # por eso el pipeline solo compila y empaqueta. Los tests se corren local.
      - name: Compilar y empaquetar
        run: ./gradlew clean bootJar --no-daemon -x test
