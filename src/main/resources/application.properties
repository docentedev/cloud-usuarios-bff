spring.application.name=demo
// postgresql://postgres.smdaoltztboxrpumbfrh:[YOUR-PASSWORD]@aws-0-us-east-2.pooler.supabase.com:5432/postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.smdaoltztboxrpumbfrh}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza la tabla "usuarios" a partir de la entidad.
# Solo para desarrollo: en producción se usan migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Seguridad: validación de JWT emitidos por Amazon Cognito ---
# Valores por defecto = los del front (cloud-usuarios-front/.env.example); se pueden
# sobreescribir con variables de entorno sin tocar este archivo.
cognito.region=${COGNITO_REGION:us-east-2}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-2_KDduqjQdn}
cognito.client-id=${COGNITO_CLIENT_ID:8vu37n7dpq595tfgsg8nrajc2}

# Resource Server: Spring Boot descubre el JWKS desde el issuer
# (https://cognito-idp.<region>.amazonaws.com/<user-pool-id>/.well-known/openid-configuration)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}